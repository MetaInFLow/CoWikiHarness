name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  cloud-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: openlifewiki
          POSTGRES_DB: openlifewiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENLIFEWIKI_TEST_DATABASE_URL: postgres://postgres:openlifewiki@127.0.0.1:5432/openlifewiki_test
      OPENLIFEWIKI_POSTGRES_TEST: "1"
      OPENLIFEWIKI_TOKEN_HMAC_SECRET: ci-only-secret-with-at-least-32-bytes
      DATABASE_URL: postgres://postgres:openlifewiki@127.0.0.1:5432/openlifewiki_test
      OPENAI_API_KEY: ci-scripted-model-placeholder
      OPENLIFEWIKI_MODEL: gpt-5.5
      OPENLIFEWIKI_MODEL_REASONING_EFFORT: xhigh
      OPENLIFEWIKI_DISABLE_RESPONSE_STORAGE: "true"
      OPENLIFEWIKI_PUBLIC_URL: http://127.0.0.1:0
      PORT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:cloud
